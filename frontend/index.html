<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IASW - Intelligent Account Servicing Workflow</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="app">
    <!-- TOP BAR -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo" id="tb-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d5afe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="tb-logo-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <span class="topbar-brand">IASW</span>
            <span class="role-chip" id="role-chip">Staff Portal</span>
        </div>
        <div class="topbar-right">
            <button class="icon-btn" title="Notifications">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <span class="badge-dot"></span>
            </button>
            <div class="user-block">
                <div class="avatar" id="user-avatar">S</div>
                <div>
                    <div class="user-name" id="user-name">staff</div>
                    <div class="user-role" id="user-role-sub">Staff Member</div>
                </div>
            </div>
            <div class="divider-v"></div>
            <button class="btn btn-secondary" onclick="logout()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </button>
        </div>
    </header>

    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <nav id="nav-list"></nav>
            <div class="help-card">
                <h4 id="help-title">Need Help?</h4>
                <div id="help-text">Contact support for assistance with requests.</div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main" id="main"></main>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h3 id="modal-title">Confirm</h3>
        <p id="modal-msg">Are you sure?</p>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="modal-confirm">Confirm</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script src="app.js?v=3"></script>
</body>
</html>
