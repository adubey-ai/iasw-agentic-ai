<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IASW - Intelligent Account Servicing Workflow</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="login-body">
    <div class="login-shell">
        <div class="login-logo">
            <div class="logo-tile">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3d5afe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
            </div>
            <h1 class="brand">IASW</h1>
            <p class="brand-sub">Intelligent Account Servicing Workflow</p>
        </div>

        <div class="login-card">
            <div class="login-tabs">
                <button class="login-tab active" data-tab="signin">Sign In</button>
                <button class="login-tab" data-tab="signup">Sign Up</button>
            </div>

            <div id="signin-pane" class="login-pane active">
                <div id="error" class="alert alert-error" style="display:none;"></div>
                <div id="success" class="alert alert-success" style="display:none;"></div>
                <form id="loginForm">
                    <div class="field">
                        <label>Username</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <input type="text" id="username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="password" required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
                </form>
                <div class="demo-creds">
                    <p><strong>Checker:</strong> checker1 / checker123</p>
                    <p><strong>Account Holder:</strong> priya.sharma / priya123</p>
                    <p><strong>Staff:</strong> staff1 / staff123</p>
                </div>
            </div>

            <div id="signup-pane" class="login-pane">
                <p class="muted" style="text-align:center;padding:24px 0;">Account provisioning is managed by your administrator. Please contact your supervisor for access.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:8000`;

        document.querySelectorAll('.login-tab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.login-tab').forEach(x => x.classList.remove('active'));
                document.querySelectorAll('.login-pane').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                document.getElementById(t.dataset.tab + '-pane').classList.add('active');
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const loginBtn = document.getElementById('loginBtn');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.role);
                    if (data.customer_id) localStorage.setItem('customer_id', data.customer_id);
                    if (data.full_name) localStorage.setItem('full_name', data.full_name);
                    successDiv.textContent = 'Welcome back! Redirecting...';
                    successDiv.style.display = 'block';
                    setTimeout(() => { window.location.href = 'index.html'; }, 600);
                } else {
                    errorDiv.textContent = data.detail || 'Invalid credentials.';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Is the backend running?';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('token')) window.location.href = 'index.html';
        });
    </script>
</body>
</html>
